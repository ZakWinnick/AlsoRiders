# Site settings
title: Also Riders Club
tagline: Riders, also.
description: >-
  An independent community for people who ride, own, reserve, or are
  curious about ALSO vehicles. Regional meetups, group rides, and
  real-world knowledge from riders figuring it out together.
url: "https://alsoriders.com"
baseurl: ""

# Heylo
heylo_url: "https://heylo.group/alsoriders" # update with actual link after Heylo group is created
heylo_label: "Start your 7-day trial"

# Social
social:
  instagram: "" # add when created, e.g. "alsoridersclub"
  bluesky: ""
  x: ""

# Contact
contact_email: "letsride@alsoriders.com"

# Build settings
markdown: kramdown
theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - .gitignore
